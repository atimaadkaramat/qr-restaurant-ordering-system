{% extends "layout.html" %}

{% block body %}

<div class="row justify-content-center">

    <div class="col-md-4">

        <h1 class="mb-4 text-center">
            Admin Login
        </h1>

        <form action="/login" method="POST">

            <div class="mb-3">

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Username"
                    required
                >

            </div>

            <div class="mb-3">

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Password"
                    required
                >

            </div>

            <button class="btn btn-dark w-100">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
